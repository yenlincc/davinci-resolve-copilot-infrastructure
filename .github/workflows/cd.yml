name: CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.11.4

    - name: Terraform Init
      run: terraform init
      working-directory: ${{ github.event.repository.name }}/environments/production

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ${{ github.event.repository.name }}/environments/production