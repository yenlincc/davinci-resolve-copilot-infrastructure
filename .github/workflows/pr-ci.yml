# Ref: https://github.com/hashicorp/setup-terraform/tree/v2/
#
# This workflow is triggered on pull requests to the dev branch.
# It runs Terraform commands to validate and plan changes, and comments the results back to the PR.
# It uses a matrix strategy to run the same steps for both staging and production environments.
# The workflow also includes a step to comment on the PR with the results of the Terraform commands.
# The comment includes the outcomes of formatting, initialization, validation, and planning.
# The comment is updated if it already exists, or created if it doesn't.
name: CI Pipeline

on:
  pull_request:
    branches:
      - dev

jobs:
  terraform:
    name: validate and plan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - uses: 'google-github-actions/auth@v2'
        with:
          project_id: 'my-project'
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
            terraform_version: 1.11.4
      
      - name: ${{ matrix.environment }} terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: false
        working-directory: ${{ github.event.repository.name }}/environments/${{ matrix.environment }}

      - name: ${{ matrix.environment }} terraform init
        id: init
        run: terraform init
        working-directory: ${{ github.event.repository.name }}/environments/${{ matrix.environment }}

      - name: ${{ matrix.environment }} terraform validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ github.event.repository.name }}/environments/${{ matrix.environment }}
      
      - name: ${{ matrix.environment }} terraform test
        id: test
        run: terraform test
        working-directory: ${{ github.event.repository.name }}/environments/${{ matrix.environment }}

      - name: ${{ matrix.environment }} terraform plan
        id: plan
        run: terraform plan
        working-directory: ${{ github.event.repository.name }}/environments/${{ matrix.environment }}
        continue-on-error: true

      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
            })
      
            // 2. Prepare format of the comment
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>
      
            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`
      
            </details>
      
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
      
            <details><summary>Show Plan</summary>
      
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
      
            </details>
      
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`*`;
      
            // 3. If we have a comment, update it, otherwise create a new one
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }